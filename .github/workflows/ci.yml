name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: futin/release-kit/.github/workflows/ci-node.yml@v1
    with:
      # A feat|fix|perf PR fails `ci / pr-title` while its What's new section is empty; `None` on its own line opts out.
      require-notes: true
      check-commands: |
        npm run typecheck
        npm test
